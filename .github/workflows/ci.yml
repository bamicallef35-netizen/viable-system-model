name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: ruff + mypy --strict + pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no runtime dependencies; dev tools only)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests (unit + Hypothesis properties)
        run: pytest -q
      - name: The demo runs
        run: python -m vsm demo
